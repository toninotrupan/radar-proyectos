<!doctype html>
<html lang="es">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex, nofollow">
<meta name="theme-color" content="#f5f6fa">
<title>Plataforma · Sermai</title>
<link rel="icon" type="image/svg+xml" href="/favicon.svg?v=2"><link rel="icon" type="image/png" sizes="32x32" href="/icono-32.png?v=2"><link rel="apple-touch-icon" href="/apple-touch-icon.png?v=2">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Geologica:wght@300..800&family=Instrument+Sans:wght@400..700&display=swap">
<script>try{var t=localStorage.getItem("radar_tema");if(t==="light"||t==="dark")document.documentElement.dataset.theme=t}catch(e){}</script>
<style>
/* ---------- Colores: minerales del cobre (azurita, malaquita, cobre) sobre salar y noche de desierto ---------- */
:root{
  --bg:#f5f6fa;--panel:#fff;--panel2:#f8f9fc;--fg:#1b2238;--muted:#626b84;--line:#e2e5ee;--soft:#eceef5;
  --ink:#fff;--ink2:#eff1fb;--ink-line:#e2e5ee;--ink-line2:#c6cce4;--ink-fg:#1b2238;--ink-muted:#626b84;--ink-strong:#141a2e;--acc:#4c5fd5;--acc-fg:#fff;
  --pri:#4c5fd5;--pri-fg:#fff;--pri-soft:#e9ecfb;
  --ok:#1f8a6d;--ok-soft:#def2ea;--cu:#b8672f;--cu-soft:#f9ebdf;
  --warn:#8a6a10;--warn-soft:#f7eed2;--bad:#b5473d;--bad-soft:#f9e3df;
  --b1:#aab6ff;--b2:#9fe3cf;--b3:#ffd2b0;--blob:.5;
  --eval:var(--pri);--eval-soft:var(--pri-soft);
  --sh1:0 1px 2px rgba(27,34,56,.05);--sh2:0 14px 34px -16px rgba(27,34,56,.22);
  --r1:8px;--r2:14px;--r3:22px;
  --disp:Geologica,"Instrument Sans",system-ui,sans-serif;--body:"Instrument Sans",system-ui,sans-serif;
  --t1:140ms;--t2:260ms;--t3:600ms;--ease:cubic-bezier(.2,.7,.2,1);
}
@media (prefers-color-scheme:dark){:root:not([data-theme=light]){
  --bg:#0d1222;--panel:#151b30;--panel2:#111729;--fg:#e8ecf7;--muted:#9aa6c2;--line:#262f4d;--soft:#1c2440;
  --ink:#0b1020;--ink2:#161d36;--ink-line:#222b49;--ink-line2:#39446b;--ink-fg:#e8ecf7;--ink-muted:#9aa6c2;--ink-strong:#fff;--acc:#9fb0ff;--acc-fg:#0a1230;
  --pri:#9fb0ff;--pri-fg:#0a1230;--pri-soft:#1f2850;
  --ok:#6fd3b4;--ok-soft:#14332c;--cu:#eaa775;--cu-soft:#38271a;
  --warn:#e3c873;--warn-soft:#342c14;--bad:#f0998e;--bad-soft:#3a1f1c;
  --b1:#3f4fb8;--b2:#1f7a68;--b3:#8a4f2a;--blob:.32;
  --sh1:none;--sh2:0 10px 30px -12px rgba(0,0,0,.7);color-scheme:dark}}
:root[data-theme=dark]{
  --bg:#0d1222;--panel:#151b30;--panel2:#111729;--fg:#e8ecf7;--muted:#9aa6c2;--line:#262f4d;--soft:#1c2440;
  --ink:#0b1020;--ink2:#161d36;--ink-line:#222b49;--ink-line2:#39446b;--ink-fg:#e8ecf7;--ink-muted:#9aa6c2;--ink-strong:#fff;--acc:#9fb0ff;--acc-fg:#0a1230;
  --pri:#9fb0ff;--pri-fg:#0a1230;--pri-soft:#1f2850;
  --ok:#6fd3b4;--ok-soft:#14332c;--cu:#eaa775;--cu-soft:#38271a;
  --warn:#e3c873;--warn-soft:#342c14;--bad:#f0998e;--bad-soft:#3a1f1c;
  --b1:#3f4fb8;--b2:#1f7a68;--b3:#8a4f2a;--blob:.32;
  --sh1:none;--sh2:0 10px 30px -12px rgba(0,0,0,.7);color-scheme:dark}

/* ---------- Base ---------- */
*,*::before,*::after{box-sizing:border-box}
html{-webkit-text-size-adjust:100%;scroll-padding-top:120px}
body{margin:0;background:var(--bg);color:var(--fg);font:15px/1.55 var(--body);-webkit-font-smoothing:antialiased}
a{color:var(--pri);text-underline-offset:3px}
h1,h2,h3{font-family:var(--disp);margin:0;text-wrap:balance;letter-spacing:-.01em}
h1{font-weight:650;font-size:clamp(24px,3.2vw,32px);line-height:1.12}
h2{font-weight:600;font-size:18px;line-height:1.25}
h3{font-weight:600;font-size:16px;line-height:1.3}
p{margin:0}
button,input,select{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--pri);outline-offset:2px;border-radius:4px}
.skip{position:absolute;left:8px;top:-60px;background:var(--pri);color:var(--pri-fg);padding:10px 14px;border-radius:var(--r1);z-index:100;text-decoration:none}
.skip:focus{top:8px}
.ic{width:20px;height:20px;flex:none;fill:none;stroke:currentColor;stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round}
.num{font-family:var(--disp);font-variant-numeric:tabular-nums}

/* ---------- Estructura: barra lateral + contenido ---------- */
.side{position:fixed;inset:0 auto 0 0;width:252px;background:var(--ink);color:var(--ink-fg);display:flex;flex-direction:column;padding:18px 12px 14px;gap:18px;overflow-y:auto;z-index:40;border-right:1px solid var(--ink-line)}
.brand{display:flex;align-items:center;gap:10px;color:var(--ink-fg);text-decoration:none;font:650 17px/1.1 var(--disp);padding:4px 8px}
.brand small{display:block;font:400 12px/1.2 var(--body);color:var(--ink-muted);margin-top:2px}
.mark{width:34px;height:34px;flex:none}
.mark .m1{fill:var(--pri-soft);stroke:var(--ink-line2)}.mark .m2{fill:none;stroke:var(--ink-line2)}.mark .m3{fill:var(--acc);opacity:.3}.mark .m4{stroke:var(--acc);stroke-width:1.5}.mark .blip{fill:var(--cu)}
.mark .sweep{transform-origin:20px 20px;animation:sweep 6s linear infinite}
.mark .blip{animation:blip 6s ease-out infinite}
@keyframes sweep{to{transform:rotate(360deg)}}
@keyframes blip{0%,12%{opacity:0}18%{opacity:1}60%,100%{opacity:0}}
.side nav{display:flex;flex-direction:column;gap:14px}
.grp{display:flex;flex-direction:column;gap:2px}
.grp>span{font-size:12px;color:var(--ink-muted);padding:0 10px 4px}
.side nav a,.side-foot a,.side-foot button{display:flex;align-items:center;gap:10px;padding:9px 10px;border-radius:var(--r1);color:var(--ink-muted);text-decoration:none;font-weight:500;font-size:14.5px;border:0;background:none;cursor:pointer;text-align:left;width:100%;transition:background var(--t1),color var(--t1)}
.side nav a:hover,.side-foot a:hover,.side-foot button:hover{background:var(--ink2);color:var(--ink-fg)}
.side nav a[aria-current=page]{background:var(--ink2);color:var(--ink-strong);box-shadow:inset 3px 0 0 var(--acc)}
.side nav a[aria-current=page] .ic{color:var(--acc)}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:2px;border-top:1px solid var(--ink-line);padding-top:10px}
.stamp{font-size:12px;color:var(--ink-muted);padding:8px 10px 0;line-height:1.4}
.wrap{margin-left:252px;min-height:100vh;display:flex;flex-direction:column}
.bar{position:sticky;top:0;z-index:30;display:flex;align-items:center;gap:12px;padding:10px 28px;background:color-mix(in srgb,var(--bg) 88%,transparent);backdrop-filter:blur(10px);border-bottom:1px solid transparent;transition:border-color var(--t2)}
.bar.scrolled{border-bottom-color:var(--line)}
.bar .brand{display:none;color:var(--fg);padding:0}
.iconbtn{display:none;width:44px;height:44px;border-radius:var(--r1);border:1px solid var(--line);background:var(--panel);align-items:center;justify-content:center;cursor:pointer;flex:none}
.search{position:relative;flex:1;max-width:560px}
.search .ic{position:absolute;left:12px;top:50%;translate:0 -50%;color:var(--muted);pointer-events:none}
.search input[type=search]{width:100%;height:44px;padding:0 44px 0 40px;border:1px solid var(--line);border-radius:999px;background:var(--panel);box-shadow:var(--sh1)}
.search kbd{position:absolute;right:12px;top:50%;translate:0 -50%;font:500 12px var(--body);color:var(--muted);border:1px solid var(--line);border-radius:6px;padding:1px 7px;background:var(--panel2)}
.qres{position:absolute;left:0;right:0;top:50px;margin:0;padding:6px;list-style:none;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);box-shadow:var(--sh2);max-height:min(60vh,420px);overflow:auto;z-index:50}
.qres li{padding:9px 10px;border-radius:var(--r1);cursor:pointer;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:2px 12px}
.qres li[aria-selected=true],.qres li:hover{background:var(--pri-soft)}
.qres b{font-weight:600;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qres small{color:var(--muted);grid-column:1;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.qres em{font-style:normal;color:var(--muted);font-size:13px;grid-row:1/3;grid-column:2;align-self:center}
.qres .none{cursor:default;color:var(--muted);display:block}
.mechip{margin-left:auto;display:inline-flex;align-items:center;gap:8px;height:44px;padding:0 14px;border-radius:999px;border:1px solid var(--line);background:var(--panel);color:var(--fg);text-decoration:none;font-weight:500;font-size:14px;white-space:nowrap;max-width:240px;box-shadow:var(--sh1)}
.mechip span{overflow:hidden;text-overflow:ellipsis}
.mechip i{width:8px;height:8px;border-radius:50%;background:var(--line);flex:none}
.mechip.on i{background:var(--ok)}
main{width:100%;max-width:1120px;margin:0 auto;padding:20px 28px 96px;display:flex;flex-direction:column;gap:20px;outline:0}
main:focus-visible{outline:0}
.tabs,.scrim{display:none}

/* ---------- Piezas comunes ---------- */
.lead{color:var(--muted);margin-top:8px;max-width:68ch;font-size:16px}
.note{color:var(--muted);font-size:13.5px;max-width:78ch}
.desc{white-space:pre-line;max-width:76ch}
.count{color:var(--muted);font-size:14px}
.meta{color:var(--muted);font-size:13.5px}
.panel{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:20px;display:flex;flex-direction:column;gap:12px;box-shadow:var(--sh1)}
.panel.hl{border-color:color-mix(in srgb,var(--pri) 45%,var(--line));background:linear-gradient(180deg,color-mix(in srgb,var(--pri-soft) 55%,var(--panel)),var(--panel) 120px)}
.panel>h2{display:flex;align-items:center;gap:10px}
.sub{font-weight:600;margin-top:6px}
.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,400px),1fr));gap:20px}
.back{display:inline-flex;align-items:center;gap:6px;font-size:14px;font-weight:500;text-decoration:none;align-self:flex-start;min-height:32px}
.back .ic{rotate:180deg;width:16px;height:16px}

/* cifras: una sola franja con divisiones, no una fila de tarjetas */
.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);overflow:hidden;box-shadow:var(--sh1)}
.kpi{padding:16px 18px;box-shadow:-1px 0 0 var(--line),0 -1px 0 var(--line)}
.kpi b{display:block;font:600 26px/1.15 var(--disp);font-variant-numeric:tabular-nums;letter-spacing:-.02em;overflow-wrap:anywhere}
.kpi span{color:var(--muted);font-size:13.5px;display:block;margin-top:2px}
.panel .kpis{box-shadow:none;background:var(--panel2)}

/* filtros */
.filters{display:flex;flex-wrap:wrap;gap:12px;align-items:end}
.filters label{display:flex;flex-direction:column;gap:5px;font-size:13px;font-weight:500;color:var(--muted);flex:1 1 170px;min-width:0}
select,input[type=text],input[type=search],input[type=number],input:not([type]){height:44px;color:var(--fg);background:var(--panel);border:1px solid var(--line);border-radius:var(--r1);padding:0 12px;width:100%;min-width:0;font-size:15px;transition:border-color var(--t1),box-shadow var(--t1)}
select:hover,input:hover{border-color:color-mix(in srgb,var(--pri) 40%,var(--line))}
select:focus,input:focus{outline:0;border-color:var(--pri);box-shadow:0 0 0 3px var(--pri-soft)}
.filterbar{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:14px 16px;box-shadow:var(--sh1)}

/* botones */
.btn,.btn2{display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:44px;padding:0 18px;border-radius:var(--r1);font-weight:600;font-size:15px;cursor:pointer;text-decoration:none;align-self:flex-start;transition:transform var(--t1),background var(--t1),border-color var(--t1)}
.btn{background:var(--pri);color:var(--pri-fg);border:1px solid var(--pri)}
.btn:hover{background:color-mix(in srgb,var(--pri) 88%,#000)}
.btn2{background:var(--panel);color:var(--fg);border:1px solid var(--line);font-weight:500}
.btn2:hover{border-color:var(--pri);color:var(--pri)}
.btn:active,.btn2:active{transform:scale(.98)}
.more{align-self:center}
.row{display:flex;flex-wrap:wrap;gap:10px;align-items:center}

/* etiquetas */
.tags{display:flex;flex-wrap:wrap;gap:6px}
.tag{font-size:12.5px;line-height:1.5;padding:2px 9px;border-radius:12px;background:var(--soft);color:var(--fg);max-width:100%}
.tag.wrapok{white-space:normal}
.tag.rubro{background:var(--cu-soft);color:var(--cu);font-weight:600}
.tag.ok{background:var(--ok-soft);color:var(--ok);font-weight:600}
.tag.eval{background:var(--eval-soft);color:var(--eval);font-weight:600}
.tag.adm{background:var(--warn-soft);color:var(--warn);font-weight:600}
.tag.bad{background:var(--bad-soft);color:var(--bad);font-weight:600}

/* tarjeta de proyecto */
.list{display:flex;flex-direction:column;gap:10px}
.card{position:relative;background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:16px 18px 14px 22px;display:grid;grid-template-columns:minmax(0,1fr) auto;gap:10px 18px;text-decoration:none;color:inherit;box-shadow:var(--sh1);transition:border-color var(--t1),box-shadow var(--t2),transform var(--t2) var(--ease)}
.card::before{content:"";position:absolute;left:0;top:14px;bottom:14px;width:4px;border-radius:0 4px 4px 0;background:var(--rail,var(--line))}
.card.c-ok{--rail:var(--ok)}.card.c-eval{--rail:var(--pri)}.card.c-adm{--rail:var(--warn)}.card.c-bad{--rail:var(--bad)}
.card::after{content:"";position:absolute;inset:0;border-radius:inherit;pointer-events:none;opacity:0;transition:opacity var(--t2);background:radial-gradient(280px circle at var(--mx,50%) var(--my,50%),color-mix(in srgb,var(--pri) 9%,transparent),transparent 70%)}
a.card:hover::after{opacity:1}
.rv{opacity:0;transform:translateY(16px)}
.rv.in{opacity:1;transform:none;transition:opacity .55s var(--ease),transform .55s var(--ease)}
a.card:hover{border-color:color-mix(in srgb,var(--pri) 50%,var(--line));box-shadow:var(--sh2);transform:translateY(-1px)}
.card .tags+h3{margin-top:8px}
.card>.tags{grid-column:1/-1}
.meta.sp{display:flex;flex-wrap:wrap;gap:2px 16px}
.card .meta{margin-top:3px}
.inv{text-align:right;font:600 22px/1.1 var(--disp);font-variant-numeric:tabular-nums;white-space:nowrap;letter-spacing:-.02em}
.inv small{display:block;font:400 12.5px var(--body);color:var(--muted);letter-spacing:0;margin-top:2px}
.card .foot{grid-column:1/-1;display:flex;flex-wrap:wrap;gap:6px 14px;align-items:center;font-size:13.5px;color:var(--muted)}
.mini{display:flex;align-items:center;gap:10px;flex:1 1 260px;min-width:0;color:var(--fg)}
.track{flex:1;height:8px;border-radius:99px;background:var(--soft);overflow:hidden;min-width:60px}
.track i{display:block;height:100%;width:var(--w,0%);border-radius:99px;background:var(--pri);transform-origin:left;animation:grow var(--t3) var(--ease) both}
.track.ok i{background:var(--ok)}
@keyframes grow{from{transform:scaleX(0)}}
.why{grid-column:1/-1;font-size:14px;color:var(--muted);border-top:1px dashed var(--line);padding-top:10px}
.why b{color:var(--fg)}
.enter{animation:enter var(--t2) var(--ease) both;animation-delay:calc(var(--i,0)*28ms)}
@keyframes enter{from{opacity:0;transform:translateY(8px)}}

/* listas de definición, oportunidades, empresas */
.dl{display:grid;grid-template-columns:auto minmax(0,1fr);gap:8px 18px;margin:0;font-size:14.5px}
.dl dt{color:var(--muted)}.dl dd{margin:0}
.opps{display:flex;flex-direction:column;gap:10px;margin:0;padding:0;list-style:none}
.opps li{border-left:3px solid var(--cu);padding:2px 0 2px 14px}
.opps li.no{border-left-color:var(--line)}
.opps b{display:block}.opps span{font-size:13.5px;color:var(--muted)}
.emp{display:grid;grid-template-columns:repeat(auto-fill,minmax(min(100%,300px),1fr));gap:10px;margin:0;padding:0;list-style:none}
.emp li{border:1px solid var(--line);border-radius:var(--r1);padding:12px 14px;font-size:14.5px;background:var(--panel2);display:flex;flex-direction:column;gap:3px}
.emp b{display:block}.emp span{color:var(--muted);font-size:13.5px;display:block}
.soon{border:1px dashed var(--line);border-radius:var(--r2);padding:22px;color:var(--muted);background:var(--panel2);display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.soon b{color:var(--fg);font:600 16px var(--disp)}
details>summary{font-weight:600;cursor:pointer;padding:6px 0;min-height:32px}
.actrow{margin:3px 0;font-size:14.5px;display:flex;flex-wrap:wrap;gap:4px 8px;align-items:baseline}
.actrow a{font-size:12.5px}

/* barras de mercado */
.bars{display:flex;flex-direction:column;gap:9px}
.bar-r{display:grid;grid-template-columns:minmax(90px,38%) minmax(0,1fr) auto;gap:10px;align-items:center;font-size:13.5px}
.bar-r>span:first-child{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.bar-r .v{font:500 13px var(--disp);font-variant-numeric:tabular-nums;white-space:nowrap}

/* tablas */
.tw{overflow-x:auto}
.tbl{width:100%;border-collapse:collapse;font-size:14.5px}
.tbl th{font-size:13px;font-weight:500;color:var(--muted);text-align:left;padding:8px 10px;white-space:nowrap}
.tbl td{padding:12px 10px;vertical-align:middle;border-top:1px solid var(--line)}
.tbl td.n,.tbl th.n{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl td small{color:var(--muted)}.tbl .tag{white-space:nowrap}
.tbl tbody tr{transition:background var(--t1)}
.tbl.hov tbody tr:hover{background:var(--panel2)}
.tbl a{font-weight:600;text-decoration:none;color:var(--fg)}
.tbl a:hover{color:var(--pri)}
.tw.boxed{background:var(--panel);border:1px solid var(--line);border-radius:var(--r2);padding:4px 10px;box-shadow:var(--sh1)}
.tbl a:hover{text-decoration:underline}
.tbl .mini{min-width:130px}
.cost input,.cost select{height:40px}.cost select{min-width:84px;padding:0 8px}.cost tr.grp td{background:var(--pri-soft);font-weight:600;border-top:2px solid var(--line)}.cost tr.grp input{font-weight:600;min-width:220px}
.ring{--p:0;width:64px;height:64px;flex:none;position:relative;display:grid;place-items:center;font:600 16px var(--disp);font-variant-numeric:tabular-nums}
.ring svg{position:absolute;inset:0;rotate:-90deg}
.ring circle{fill:none;stroke-width:6;stroke:var(--soft)}
.ring circle+circle{stroke:var(--rc,var(--pri));stroke-linecap:round;stroke-dasharray:calc(var(--p)*1.634) 163.4;animation:ring var(--t3) var(--ease) both}
@keyframes ring{from{stroke-dasharray:0 163.4}}
.gauges{display:grid;grid-template-columns:repeat(auto-fit,minmax(min(100%,230px),1fr));gap:12px}
.gauge{display:flex;gap:14px;align-items:center;background:var(--panel2);border:1px solid var(--line);border-radius:var(--r2);padding:14px}
.gauge b{display:block;font:600 16px/1.25 var(--disp)}
.gauge span{font-size:13.5px;color:var(--muted)}
.gauge .cal{width:64px;height:64px;flex:none;border-radius:16px;background:var(--pri-soft);color:var(--pri);display:grid;place-items:center}
.gauge .cal .ic{width:28px;height:28px}

/* ---------- Flujograma 1: la ruta, del expediente al contrato ---------- */
.hero{background:var(--ink);color:var(--ink-fg);border:1px solid var(--ink-line);border-radius:var(--r3);padding:28px 28px 24px;display:flex;flex-direction:column;gap:8px;position:relative;overflow:hidden;isolation:isolate;box-shadow:var(--sh1)}
/* fondo vivo de la portada: manchas de color que derivan lento, curvas de nivel y una luz que sigue al cursor */
.aura{position:absolute;inset:0;z-index:-2;overflow:hidden;pointer-events:none}
.aura i{position:absolute;width:46%;aspect-ratio:1;border-radius:50%;filter:blur(70px);opacity:var(--blob);will-change:transform}
.aura i:nth-child(1){background:var(--b1);left:-8%;top:-45%;animation:drift1 22s ease-in-out infinite alternate}
.aura i:nth-child(2){background:var(--b2);right:-6%;top:-30%;animation:drift2 26s ease-in-out infinite alternate}

  const go=i=>{const it=items[i];if(!it)return;q.value="";close();q.blur();location.hash=it.h};
  q.addEventListener("input",()=>{const s=norm(q.value.trim());res.textContent="";items=[];if(s.length<2){close();return}
    titulares().filter(t=>norm(t.nombre+" "+t.soc.join(" ")).includes(s)).slice(0,3).forEach(t=>items.push({h:"#t-"+encodeURIComponent(t.k),b:t.nombre,s:"Empresa, "+t.ps.length+(t.ps.length===1?" proyecto":" proyectos"),e:t.inv?"US$ "+money(t.inv)+" M":""}));
    P.filter(p=>norm(p.nombre+" "+(p.titular||"")).includes(s)).slice(0,7).forEach(p=>items.push({h:"#p-"+p.id,b:p.nombre,s:(p.titular||"")+", "+regionCorta(p.region),e:"US$ "+money(p.inversion_mmusd)+" M"}));
    if(!items.length){res.append(el("li","none","No encontramos proyectos ni empresas con ese nombre. Prueba con otra palabra."))}
    items.forEach((it,i)=>{const li=el("li");li.id="qr"+i;li.setAttribute("role","option");li.append(el("b",null,it.b),el("small",null,it.s),el("em",null,it.e));li.onmousedown=e=>{e.preventDefault();go(i)};res.append(li)});
    cur=items.length?0:-1;res.hidden=false;q.setAttribute("aria-expanded","true");mark()});
  q.addEventListener("keydown",e=>{if(e.key==="ArrowDown"||e.key==="ArrowUp"){if(!items.length)return;e.preventDefault();cur=(cur+(e.key==="ArrowDown"?1:-1)+items.length)%items.length;mark()}else if(e.key==="Enter"){e.preventDefault();go(Math.max(cur,0))}else if(e.key==="Escape"){close()}});
  q.addEventListener("blur",()=>setTimeout(close,120));
  addEventListener("keydown",e=>{if(e.key==="Escape"&&side.classList.contains("open"))drawer(false);if(e.key==="/"&&!/^(INPUT|SELECT|TEXTAREA)$/.test(document.activeElement.tagName)&&!e.metaKey&&!e.ctrlKey){e.preventDefault();q.focus()}});
}
function render(first){const h=(location.hash||"#inicio").slice(1);const app=$("#app");CLEAN.splice(0).forEach(f=>f());app.textContent="";ANIM=true;
  const nav=h.startsWith("p-")||h.startsWith("c-")||h.startsWith("i-")?"proyectos":h.startsWith("t-")?"empresas":VISTAS[h]?h:"inicio";document.querySelectorAll("[data-nav]").forEach(a=>a.dataset.nav===nav?a.setAttribute("aria-current","page"):a.removeAttribute("aria-current"));
  if(h.startsWith("p-"))vFicha(app,h.slice(2));else if(h.startsWith("c-"))vCosteo(app,h.slice(2));else if(h.startsWith("i-"))vInforme(app,h.slice(2));else if(h.startsWith("t-"))vTitular(app,decodeURIComponent(h.slice(2)));else(VISTAS[h]||vInicio)(app);
  ANIM=false;chip();
  const h1=app.querySelector("h1");document.title=(h1?h1.textContent+" | ":"")+"Sermai";scrollTo(0,0);
  if(!RM&&"IntersectionObserver" in window){const io=new IntersectionObserver(es=>es.forEach(e=>{if(e.isIntersecting){e.target.classList.add("in");io.unobserve(e.target)}}),{rootMargin:"0px 0px -6% 0px"});const vh=innerHeight*.92;app.querySelectorAll(":scope>section,:scope>.kpis,:scope>.grid2>*,.sec>.panel,.sec>.grid2>*").forEach(n=>{if(n.getBoundingClientRect().top>vh){n.classList.add("rv");io.observe(n)}});CLEAN.push(()=>io.disconnect())}if(!first)app.focus({preventScroll:true})}
function chip(){const pf=perfil(),mc=$("#mechip"),on=!!(pf&&pf.rubros.length);mc.classList.toggle("on",on);mc.querySelector("span").textContent=on?(pf.nombre||"Mi empresa"):"Configurar mi empresa";mc.setAttribute("aria-label",on?"Mi empresa: "+(pf.nombre||"configurada"):"Configurar mi empresa")}
function route(){if(document.startViewTransition&&!RM){const t=document.startViewTransition(()=>render());t.ready.catch(()=>{});t.finished.catch(()=>{})}else render()}
async function boot(){const app=$("#app");
  try{[P,C]=await Promise.all([get("radar_proyectos?select=*&order=inversion_mmusd.desc.nullslast"),get("radar_cambios?select=*&order=detectado_at.desc&limit=500")]);
    try{[E,PE,N]=await Promise.all([get("radar_empresas?select=*&order=nombre"),get("radar_proyecto_empresas?select=*"),get("radar_notas?select=*&order=fecha.desc")])}catch(e){E=[];PE=[];N=[]}
    try{G=(await get("radar_grupos?select=*")).map(g=>({...g,re:new RegExp(g.patron)}))}catch(e){G=[]}
    try{[SA,SR]=await Promise.all([get("radar_sanciones?select=*&order=expediente.desc"),get("radar_sanciones_revisado?select=*")])}catch(e){SA=[];SR=[]}
    try{const [co,ce,st]=await Promise.all([get("radar_construccion?select=*&order=inversion_mmusd.desc.nullslast"),get("radar_construccion_empresas?select=*"),get("radar_estadistica?select=*")]);CO=co;CE=ce;st.forEach(x=>ST[x.clave]=x.valor)}catch(e){CO=[];CE=[];ST={}}
    try{TH=await get("radar_titular_historial?select=*")}catch(e){TH=[]}
    $("#stamp").textContent="Última lectura del SEIA: "+lastUpd();addEventListener("hashchange",route);render(true)}
  catch(e){app.textContent="";const s=el("div","soon");s.setAttribute("role","alert");const b=el("button","btn","Volver a intentar");b.type="button";b.onclick=()=>{app.textContent="";app.append(el("p","count","Cargando proyectos…"));boot()};s.append(el("b",null,"No se pudieron cargar los proyectos"),el("span",null,"Revisa tu conexión a internet y vuelve a intentar. Detalle: "+e.message),b);app.append(s)}}
shell();boot();
</script>
